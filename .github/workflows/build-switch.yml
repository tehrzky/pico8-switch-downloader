- name: Install Switch Dependencies
        shell: bash
        run: |
          # Configure custom XferCommand with browser User-Agent to bypass Cloudflare 403 blocking
          echo 'XferCommand = /usr/bin/curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -L -C - -f -o %o %u' >> /opt/devkitpro/pacman/etc/pacman.conf

          # Synchronize databases and install libraries
          dkp-pacman -Sy --noconfirm \
            switch-curl \
            switch-mbedtls \
            switch-zlib \
            switch-sdl2 \
            switch-sdl2_image \
            switch-sdl2_ttf \
            switch-tools
